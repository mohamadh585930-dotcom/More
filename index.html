main{max-width:560px;margin:0 auto}
h1{font-size:2rem;font-weight:300;margin:16px 4px 18px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.tile{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:var(--card);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1.5px solid transparent;border-radius:999px;padding:7px 12px;color:var(--ink);font:inherit;font-size:.95rem;cursor:pointer}
#tEnc{background:rgba(64,224,208,.22);border-color:rgba(64,224,208,.35)}
#tDec{background:rgba(255,120,185,.22);border-color:rgba(255,120,185,.35)}
#tEnc[aria-selected="true"]{background:rgba(64,224,208,.36);border-color:#40e0d0}
#tDec[aria-selected="true"]{background:rgba(255,120,185,.36);border-color:#ff78b9}
.ico{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:none}
.ico svg{width:15px;height:15px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.o{background:#ffa927}.p{background:#7b7ef5}
label{display:block;color:var(--mute);margin:18px 4px 6px;font-size:.92rem;text-shadow:0 1px 4px rgba(0,0,0,.7)}
input,textarea{width:100%;background:rgba(255,255,255,.18);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:16px;padding:14px;font:inherit;box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
input::placeholder,textarea::placeholder{color:rgba(255,255,255,.6)}
textarea{min-height:130px;resize:vertical}
.row{display:flex;gap:8px;margin-top:16px}
.btn{background:var(--accent);color:#14161c;border:0;border-radius:999px;padding:11px 26px;font:inherit;cursor:pointer}
.btn.alt{background:var(--card);color:var(--accent);border:1px solid rgba(255,255,255,.12)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.msg{min-height:1.6em;margin:12px 4px 0;font-size:.92rem;text-shadow:0 1px 4px rgba(0,0,0,.8)}
.ok{color:var(--ok)}.err{color:var(--err)}
.note{color:var(--mute);font-size:.85rem;margin:28px 4px 0;text-shadow:0 1px 4px rgba(0,0,0,.8)}
[hidden]{display:none!important}
.box{position:relative}
.box textarea{padding-bottom:52px}
.box .btn{position:absolute;bottom:10px;left:10px;padding:4px 16px;font-size:.85rem;background:rgba(255,255,255,.22);color:#fff;border:1px solid rgba(255,255,255,.4)}
.pw{position:relative}
.pw input{padding-left:50px}
.eye{position:absolute;left:8px;top:50%;transform:translateY(-50%);width:36px;height:36px;display:grid;place-items:center;background:none;border:0;border-radius:50%;color:#fff;cursor:pointer;padding:0}
.eye svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.eye .off{display:none}
.eye[aria-pressed="true"] .on{display:none}
.eye[aria-pressed="true"] .off{display:block}
</style>
<meta name="apple-mobile-web-app-title" content="more">
<meta name="theme-color" content="#0a0c12">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
<main>
<h1>رمز متن</h1>

<div class="tabs" role="tablist">
  <button class="tile" role="tab" id="tEnc" aria-selected="true"><span class="ico o"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span>رمزگذاری</button>
  <button class="tile" role="tab" id="tDec" aria-selected="false"><span class="ico p"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 7.5-2"/></svg></span>رمزگشایی</button>
</div>

<!-- رمزگذاری -->
<section id="enc">
  <label for="etext">متن</label>
  <textarea id="etext"></textarea>
  <label for="ep">رمز دلخواه</label>
  <div class="pw"><input id="ep" type="password" autocomplete="off"><button type="button" class="eye" aria-label="نمایش رمز" aria-pressed="false"><svg class="on" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><svg class="off" viewBox="0 0 24 24"><path d="M3 3l18 18"/><path d="M10.6 5.1A10 10 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4.2M6.6 6.7A17 17 0 0 0 2 12s3.6 7 10 7a10 10 0 0 0 4-.8"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg></button></div>
  <div class="row"><button class="btn" id="doEnc">رمزگذاری</button></div>
  <div class="msg" id="em" role="status"></div>
  <div id="eout" hidden>
    <label for="ecipher">متن رمزگذاری‌شده</label>
    <div class="box"><textarea id="ecipher" readonly dir="ltr"></textarea><button class="btn alt" id="copyEnc">کپی</button></div>
  </div>
</section>

<!-- رمزگشایی -->
<section id="dec" hidden>
  <label for="dcipher">متن رمزگذاری‌شده</label>
  <textarea id="dcipher" dir="ltr"></textarea>
  <label for="dp">رمز</label>
  <div class="pw"><input id="dp" type="password" autocomplete="off"><button type="button" class="eye" aria-label="نمایش رمز" aria-pressed="false"><svg class="on" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><svg class="off" viewBox="0 0 24 24"><path d="M3 3l18 18"/><path d="M10.6 5.1A10 10 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4.2M6.6 6.7A17 17 0 0 0 2 12s3.6 7 10 7a10 10 0 0 0 4-.8"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg></button></div>
  <div class="row"><button class="btn" id="doDec">رمزگشایی</button></div>
  <div class="msg" id="dm" role="status"></div>
  <div id="dout" hidden>
    <label for="dplain">متن اصلی</label>
    <textarea id="dplain" readonly></textarea>
    <div class="row"><button class="btn alt" id="copyDec">کپی</button></div>
  </div>
</section>

</main>

<script>
const $ = id => document.getElementById(id);
const te = new TextEncoder(), td = new TextDecoder();
const ITER = 250000;

const toB64 = b => { let s=""; new Uint8Array(b).forEach(x=>s+=String.fromCharCode(x)); return btoa(s); };
const fromB64 = s => Uint8Array.from(atob(s.replace(/\s+/g,"")), c => c.charCodeAt(0));

async function keyFrom(pass, salt){
  const base = await crypto.subtle.importKey("raw", te.encode(pass), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:ITER, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
}
async function encrypt(text, pass){
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:"AES-GCM", iv}, await keyFrom(pass, salt), te.encode(text));
  const out = new Uint8Array(28 + ct.byteLength);
  out.set(salt,0); out.set(iv,16); out.set(new Uint8Array(ct),28);
  return toB64(out);
}
async function decrypt(b64, pass){
  const d = fromB64(b64);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:d.slice(16,28)}, await keyFrom(pass, d.slice(0,16)), d.slice(28));
  return td.decode(pt);
}
function say(id, t, ok){ const e=$(id); e.textContent=t; e.className="msg "+(ok?"ok":"err"); }

/* تب‌ها */
function tab(which){
  const isEnc = which === "enc";
  $("enc").hidden = !isEnc; $("dec").hidden = isEnc;
  $("tEnc").setAttribute("aria-selected", isEnc);
  $("tDec").setAttribute("aria-selected", !isEnc);
  // نتیجه‌های قبلی پاک می‌شوند
  $("dplain").value = ""; $("dout").hidden = true; $("dm").textContent = "";
}
$("tEnc").onclick = () => tab("enc");
$("tDec").onclick = () => tab("dec");

/* رمزگذاری */
$("doEnc").onclick = async () => {
  $("eout").hidden = true;
  if(!$("etext").value) return say("em","متنی وارد نشده است.",false);
  if(!$("ep").value) return say("em","رمز را وارد کنید.",false);
  try{
    $("ecipher").value = await encrypt($("etext").value, $("ep").value);
    $("eout").hidden = false;
    say("em","رمزگذاری شد. متن رمزگذاری‌شده را کپی کنید.",true);
  }catch(e){ say("em","رمزگذاری ناموفق بود.",false); }
};

/* رمزگشایی: متن اصلی فقط با رمز درست نمایش داده می‌شود */
$("doDec").onclick = async () => {
  $("dout").hidden = true; $("dplain").value = "";
  if(!$("dcipher").value.trim()) return say("dm","متن رمزگذاری‌شده را بچسبانید.",false);
  if(!$("dp").value) return say("dm","رمز را وارد کنید.",false);
  try{
    $("dplain").value = await decrypt($("dcipher").value.trim(), $("dp").value);
    $("dout").hidden = false;
    say("dm","رمز درست است.",true);
  }catch(e){
    say("dm","رمز اشتباه است یا متن رمزگذاری‌شده کامل نیست.",false);
  }
};

async function copy(id, m){
  const el = $(id);
  try{ await navigator.clipboard.writeText(el.value); }
  catch(e){ el.select(); document.execCommand("copy"); }
  say(m,"کپی شد.",true);
}
$("copyEnc").onclick = () => copy("ecipher","em");
$("copyDec").onclick = () => copy("dplain","dm");

/* نمایش/پنهان کردن رمز */
document.querySelectorAll(".eye").forEach(b => b.onclick = () => {
  const inp = b.parentElement.querySelector("input");
  const show = inp.type === "password";
  inp.type = show ? "text" : "password";
  b.setAttribute("aria-pressed", show);
  b.setAttribute("aria-label", show ? "پنهان کردن رمز" : "نمایش رمز");
});
</script>
<script>
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
}
</script>
</body>
</html>
